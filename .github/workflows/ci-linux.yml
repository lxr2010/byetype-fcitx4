name: Linux CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 系统依赖与 docs/linux-build.md 构建依赖列表保持一致
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            libasound2-dev libxdo-dev libxtst-dev libx11-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend build (tsc + vite)
        run: npm run build

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --quiet

      # 只报告警告不阻塞：存量代码（含上游既有模块）尚未达到 clippy 零警告，
      # 待统一治理后再升级为 -D warnings。
      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --quiet
